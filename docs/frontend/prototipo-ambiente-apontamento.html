<title>Ambiente de Apontamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: bandeja lateral (recolhe no ambiente de apontamento) + barra de passos no topo; passo 2 = lista de status fixa à esquerda + todas as máquinas em sequência à direita,
   cada uma com "Concluir" (o distribuidor aponta as 22 em sequência, sem abrir e fechar telas).
   Cores e tipos copiados do Dash de Produção (tokens.css), para o protótipo parecer a tela real. */
:root {
  --bg: #F7F9FA;
  --surface: #FFFFFF;
  --sunken: #EEF1F4;
  --fg: #161F2D;
  --subtle: #434F60;
  --subtlest: #5D6979;
  --border: #D9DEE5;
  --border-strong: #AEB7C2;
  --brand: #0062B2;
  --brand-hover: #00508F;
  --on-brand: #FFFFFF;
  --selected-bg: #E7F3FE;
  --selected-fg: #105893;
  --success: #126836; --success-bg: #E7F8ED;
  --warning: #914808; --warning-bg: #FFF1D1;
  --danger: #AD1F1F; --danger-bg: #FEE9E9;
  --neutral-bg: #EEF1F4;
  --banner: #2C3644; --on-banner: #FFFFFF;
  --shadow: 0 1px 2px rgba(22,31,45,.08), 0 0 1px rgba(22,31,45,.18);
  --overlay: rgba(22,31,45,.45);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101722; --surface: #18212E; --sunken: #121A25; --fg: #E6EAF0; --subtle: #B4BDC9; --subtlest: #96A1AF;
    --border: #2F3B4B; --border-strong: #4A5A70; --brand: #4C9EEB; --brand-hover: #74B5F2; --on-brand: #0B1420;
    --selected-bg: #11304D; --selected-fg: #9CCBF7;
    --success: #6FD39A; --success-bg: #12301F; --warning: #F5B25C; --warning-bg: #3A2A10; --danger: #F38B8B; --danger-bg: #3D1717;
    --neutral-bg: #222D3B; --banner: #050A12; --on-banner: #E6EAF0;
    --shadow: 0 0 0 1px #2F3B4B; --overlay: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101722; --surface: #18212E; --sunken: #121A25; --fg: #E6EAF0; --subtle: #B4BDC9; --subtlest: #96A1AF;
  --border: #2F3B4B; --border-strong: #4A5A70; --brand: #4C9EEB; --brand-hover: #74B5F2; --on-brand: #0B1420;
  --selected-bg: #11304D; --selected-fg: #9CCBF7;
  --success: #6FD39A; --success-bg: #12301F; --warning: #F5B25C; --warning-bg: #3A2A10; --danger: #F38B8B; --danger-bg: #3D1717;
  --neutral-bg: #222D3B; --banner: #050A12; --on-banner: #E6EAF0;
  --shadow: 0 0 0 1px #2F3B4B; --overlay: rgba(0,0,0,.6); color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--font); margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
input[list]::-webkit-calendar-picker-indicator { display: none !important; }

.banner { background: var(--banner); color: var(--on-banner); padding: 8px 16px; font-size: 13px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner b { font-weight: 600; }
.banner .sp { flex: 1; }
.banner button { background: transparent; border: 1px solid rgba(255,255,255,.35); color: inherit; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 13px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.top h1 { font-size: 18px; font-weight: 700; }
.steps { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.steps li button { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 6px 10px; border-radius: 999px; cursor: pointer; color: var(--subtlest); font-weight: 500; font-size: 14px; }
.steps li button:disabled { cursor: not-allowed; opacity: .6; }
.steps .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--neutral-bg); color: var(--subtle); }
.steps li[aria-current="step"] button { background: var(--selected-bg); color: var(--selected-fg); }
.steps li[aria-current="step"] .dot { background: var(--brand); color: var(--on-brand); }
.steps li.done .dot { background: var(--success-bg); color: var(--success); }
.ctx { margin-left: auto; font-size: 13px; color: var(--subtle); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctx .chip { background: var(--sunken); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }

/* ---------- Casca: bandeja lateral e ambiente de apontamento ---------- */
.tray { position: fixed; inset: 0 auto 0 0; width: 240px; z-index: 30; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; padding: 12px; overflow-y: auto; transition: transform .25s ease, box-shadow .25s ease; }
.content { margin-left: 240px; min-width: 0; transition: margin-left .25s ease; }
.scrim { position: fixed; inset: 0; background: var(--overlay); z-index: 25; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 8px; }
.tile { width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.brand b { display: block; font-size: 14px; line-height: 1.2; }
.brand small { display: block; font-size: 12px; color: var(--subtle); line-height: 1.2; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: var(--subtle); font-size: 14px; text-align: left; }
.nav button:hover { background: var(--sunken); color: var(--fg); }
.nav button[aria-current="page"] { background: var(--neutral-bg); color: var(--fg); font-weight: 600; }
.nav svg, .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.who { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-top: 1px solid var(--border); font-size: 13px; }
.who .av { width: 28px; height: 28px; border-radius: 50%; background: var(--selected-bg); color: var(--selected-fg); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.who small { display: block; color: var(--subtle); }
body.immersive .tray { transform: translateX(-100%); }
body.immersive .content { margin-left: 0; }
.tray.open, body.immersive .tray.open { transform: none; box-shadow: 10px 0 30px rgba(0,0,0,.22); }
.menu-btn { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 8px; cursor: pointer; color: var(--fg); }
.menu-btn:hover { background: var(--sunken); }
body.immersive .menu-btn { display: inline-flex; }
.mode { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--selected-bg); color: var(--selected-fg); white-space: nowrap; }
body.immersive .top { border-top: 3px solid var(--brand); }
.top-in .exit { margin-left: 4px; }
.home { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; padding-inline: 16px; display: grid; gap: 20px; }
.home h2 { font-size: 22px; }
.home .cta { padding: 24px; display: grid; gap: 12px; justify-items: start; }
.home .cta p { margin: 0; color: var(--subtle); max-width: 60ch; }
.ghost-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); opacity: .55; }
@media (prefers-reduced-motion: reduce) { .tray, .content { transition: none; } }
@media (max-width: 860px) {
  .content { margin-left: 0; }
  .tray { transform: translateX(-100%); }
  .menu-btn { display: inline-flex; }
  .ghost-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

main { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; padding-inline: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid transparent; font-weight: 600; cursor: pointer; font-size: 14px; }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-hover); }
.btn-default { background: var(--neutral-bg); color: var(--fg); }
.btn-default:hover { filter: brightness(.96); }
.btn-subtle { background: var(--surface); color: var(--subtle); border-color: var(--border-strong); }
.btn-subtle:hover { background: var(--neutral-bg); color: var(--fg); }
.btn-link { background: var(--surface); border: 1px solid var(--border-strong); color: var(--brand); padding: 0 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
.btn-link:hover { background: var(--selected-bg); border-color: var(--brand); }
.btn-danger-o { color: var(--danger); border-color: var(--danger); }
.btn-danger-o:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn-lg { min-height: 48px; font-size: 15px; padding: 0 20px; }

.card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--subtle); margin-bottom: 6px; }
.hint { font-size: 13px; color: var(--subtlest); margin: 4px 0 0; }
.err { font-size: 13px; color: var(--danger); margin: 6px 0 0; }
input[type=text], input[type=date], input[type=number], textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; min-height: 44px; padding: 8px 12px; }
input:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 1px var(--brand); }
input.invalid { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }

.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--subtle); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--selected-fg); box-shadow: var(--shadow); }
.seg.invalid { border-color: var(--danger); }

.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.opt { position: relative; min-height: 56px; padding: 10px 14px; text-align: left; font-weight: 600; font-size: 15px; background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: 10px; cursor: pointer; }
.opt:hover { border-color: var(--brand); }
.opt[aria-pressed="true"] { background: var(--selected-bg); border-color: var(--brand); color: var(--selected-fg); box-shadow: 0 0 0 1px var(--brand); }
.opt[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-weight: 700; }
.opts.invalid { outline: 2px solid var(--danger); outline-offset: 3px; border-radius: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; min-height: 36px; }
.chips button[aria-pressed="true"] { background: var(--selected-bg); border-color: var(--brand); color: var(--selected-fg); font-weight: 600; }

.loz { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.loz-ok { background: var(--success-bg); color: var(--success); }
.loz-off { background: var(--neutral-bg); color: var(--subtle); }
.loz-edit { background: var(--selected-bg); color: var(--selected-fg); }

/* ---------- Passo 1 ---------- */
.step1 { max-width: 640px; margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
.step1 h2 { font-size: 22px; }
.step1 p { margin: 4px 0 0; color: var(--subtle); }

/* ---------- Passo 2: lista de status + todas as máquinas ---------- */
.split { display: grid; grid-template-columns: minmax(0, 290px) minmax(0, 1fr); gap: 24px; align-items: start; }
.status { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 16px; display: grid; gap: 14px; }
.progress { display: grid; gap: 6px; }
.bar { height: 6px; background: var(--neutral-bg); border-radius: 999px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.b-ok { background: var(--success); }
.b-off { background: var(--subtlest); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--subtle); }
.legend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.group-t { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--subtlest); margin: 0 0 4px; }
.srows { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.srow { border: 1px solid var(--border) !important; background: var(--surface) !important; margin-bottom: 3px; width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 13.5px; min-height: 34px; }
.srow:hover { background: var(--sunken) !important; }
.srow .st { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--subtlest); }
.srow.ok .st { background: var(--success); border-color: var(--success); }
.srow.off .st { background: var(--subtlest); border-color: var(--subtlest); }
.srow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow.ok .nm, .srow.off .nm { color: var(--subtle); }
.srow.next { background: var(--selected-bg) !important; border-color: var(--brand) !important; color: var(--selected-fg); font-weight: 600; }

.machines { display: grid; gap: 28px; min-width: 0; }
.mgroup { display: grid; gap: 10px; }
.mgroup h2 { font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.mgroup h2 span { font-size: 13px; font-weight: 400; color: var(--subtlest); }
.mcard { padding: 18px 20px; display: grid; gap: 14px; scroll-margin-top: 140px; }
.mcard.next { box-shadow: 0 0 0 2px var(--brand); }
.mhead { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.mhead h3 { font-size: 16px; flex: 1; min-width: 0; }
.mmeta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; color: var(--subtle); }
.mmeta b { color: var(--fg); font-weight: 600; }
.op { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 150px) auto; gap: 10px 12px; align-items: start; }
.op + .op { border-top: 1px solid var(--border); padding-top: 14px; }
.op .reason { grid-column: 1 / -1; max-width: 460px; }
.qty { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.op-tools { display: flex; align-items: center; gap: 12px; padding-top: 26px; flex-wrap: wrap; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; min-height: 40px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); }
.check:has(input:checked) { background: var(--selected-bg); border-color: var(--brand); color: var(--selected-fg); font-weight: 600; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }
.warn { background: var(--warning-bg); color: var(--warning); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.warn b { font-weight: 600; }
.warn .btn { min-height: 32px; padding: 0 10px; background: var(--surface); color: var(--fg); }
.extras { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.people { max-width: 90px; }
.mactions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; }
.mactions .sp { flex: 1; }
/* Máquina concluída: uma linha só, com o resumo e "Editar" */
.mdone { padding: 12px 20px; display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; scroll-margin-top: 140px; }
.mdone h3 { font-size: 15px; font-weight: 600; }
.mdone .sum { color: var(--subtle); font-size: 14px; flex: 1; min-width: 12rem; }
.stopped { display: grid; gap: 10px; }

.mobile-bar { display: none; }

/* ---------- Passo 3 ---------- */
.step3 { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { padding: 16px 20px; border-right: 1px solid var(--border); }
.kpi:last-child { border-right: 0; }
.kpi span { display: block; font-size: 13px; color: var(--subtle); }
.kpi strong { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.box { padding: 20px; display: grid; gap: 12px; }
.box h3 { font-size: 16px; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plain li { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.done-msg { padding: 32px 24px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.done-msg h2 { font-size: 22px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--banner); color: var(--on-banner); padding: 10px 16px; border-radius: 8px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .18s ease-out; } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0; } } }

.modal-bg { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: 16px; z-index: 40; }
.modal { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 440px; width: 100%; display: grid; gap: 12px; }
.modal h2 { font-size: 18px; }
.modal .row-btn { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .status { display: none; }
  /* No celular o topo rola junto; fica fixa só a barra de progresso */
  .top { position: static; }
  .mcard, .mdone { scroll-margin-top: 72px; }
  .mobile-bar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; box-shadow: var(--shadow); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(2) { border-right: 0; }
  .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
  .ctx { margin-left: 0; }
}
@media (max-width: 520px) {
  .op { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .op-tools { grid-column: 1 / -1; padding-top: 0; }
  .mcard { padding: 16px; }
  .mdone { padding: 12px 16px; }
  .step1 { padding: 16px; }
}
</style>

<div class="shell">
  <aside class="tray" id="tray" aria-label="Navegação">
    <div class="brand"><span class="tile" aria-hidden="true">DP</span><span><b>Dash de Produção</b><small>Tomadas &amp; Interruptores · Itajaí</small></span></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="who"><span class="av" aria-hidden="true">RS</span><span>Rafael Souza<small>Distribuidor</small></span></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="content">
    <div class="banner" role="note">
      <b>Protótipo</b> <span>Dados fictícios, nada é gravado. Serve só para testar o fluxo.</span>
      <span class="sp"></span>
      <button type="button" id="sample">Carregar exemplo (turno pela metade)</button>
      <button type="button" id="reset">Recomeçar</button>
    </div>

    <header class="top">
      <div class="top-in">
        <button type="button" class="menu-btn" id="menu" aria-label="Abrir a navegação" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <h1 id="ptitle">Dashboard</h1>
        <span class="mode" id="mode" hidden>Ambiente de apontamento</span>
        <ol class="steps" id="steps"></ol>
        <div class="ctx" id="ctx"></div>
        <button type="button" class="btn btn-subtle exit" id="exit" aria-label="Sair do apontamento" title="Sair do apontamento" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sair</button>
      </div>
    </header>

    <main id="app" hidden></main>
    <main id="home" class="home"></main>
  </div>
</div>
<div id="layer"></div>

<script>
(() => {
  // ---------- Dados (os mesmos nomes e metas do modo de demonstração do Dash) ----------
  const M = [
    ["m1", "Máquina de interruptores Composé nº 1", "Montagem", 4000],
    ["m4", "Máquina de tomadas Composé (Aumaq)", "Montagem", 11000],
    ["m11", "Máquina de plugue Slin (Aumaq)", "Montagem", 5800],
    ["m2", "Embaladora kit parafusos nº 1", "Montagem", null],
    ["m3", "Embaladora kit parafusos nº 2", "Montagem", null],
    ["m5", "Bancada nº 1 · teste de interruptores", "Montagem", null],
    ["m6", "Bancada nº 2 · montagem de interruptores", "Montagem", null],
    ["m7", "Bancada nº 3 · diversos", "Montagem", null],
    ["m8", "Bancada nº 4 · diversos", "Montagem", null],
    ["m9", "Bancada nº 5 · eletrônicos", "Montagem", null],
    ["m10", "Prensa de inserção de contatos", "Montagem", null],
    ["m12", "Prensa Tox", "Montagem", null],
    ["m13", "Prensa placa Refinatto", "Montagem", null],
    ["e1", "Embaladora vertical conjuntos nº 1", "Embalagem", 4400],
    ["e2", "Embaladora vertical conjuntos nº 2", "Embalagem", 4400],
    ["e3", "Embaladora horizontal nº 1", "Embalagem", 9200],
    ["e4", "Embaladora horizontal nº 2", "Embalagem", 9200],
    ["e5", "Embaladora 4x2 suportes/placas nº 1", "Embalagem", 6800],
    ["e6", "Embaladora 4x2 suportes/placas nº 2", "Embalagem", 6800],
    ["e7", "Embaladora vertical módulos nº 1", "Embalagem", 11600],
    ["e8", "Embaladora vertical módulos nº 2", "Embalagem", 11600],
    ["e9", "Bancada de embalagem a granel", "Granel", 21000],
  ].map(([id, name, line, perShift], i) => ({
    id, name, line, perShift,
    released: i % 5 === 1 ? ["45" + (10204 + i * 37), "45" + (10311 + i * 41)] : ["45" + (10204 + i * 37)],
    // Onde a meta depende do nº de pessoas (no Dash: "conforme a lotação")
    byPeople: id === "e9" || id === "e5" || id === "e6",
    stdPeople: id === "e9" ? 6 : 3,
  }));
  const LINES = ["Montagem", "Embalagem", "Granel"];
  const SHIFTS = [{ v: "1", label: "Turno 1" }, { v: "2", label: "Turno 2" }, { v: "3", label: "Turno 3" }];
  const REASONS = ["Rebarba na peça", "Cor fora do padrão", "Montagem invertida", "Falha no teste elétrico", "Encaixe com folga"];
  const STOP_REASONS = ["Parada", "Manutenção", "Sem OP liberada", "Sem operador", "Setup / troca de produto"];
  const nf = new Intl.NumberFormat("pt-BR");
  const fmt = (n) => nf.format(n);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const byId = (id) => M.find((m) => m.id === id);
  const dateLabel = (iso) => new Intl.DateTimeFormat("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" }).format(new Date(iso + "T12:00:00"));

  // ---------- Casca: seção aberta e bandeja lateral ----------
  const V = { view: "dashboard", tray: false };
  const NAV = [["dashboard", "Dashboard", "dash"], ["apontamento", "Apontamento", "clip"], ["ops", "OPs", "file"], ["historico", "Histórico", "hist"], ["metas", "Metas", "target"], ["calendario", "Calendário", "cal"], ["feedbacks", "Feedbacks", "msg"], ["relatorios", "Relatórios", "chart"]];
  const ICON = {
    dash: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
    clip: '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>',
    file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',
    hist: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
    target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    cal: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    chart: '<path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
  };
  const wide = () => matchMedia("(min-width: 861px)").matches;

  function renderShell() {
    const imm = V.view === "apontamento";
    document.body.classList.toggle("immersive", imm);
    const tray = document.getElementById("tray");
    tray.classList.toggle("open", V.tray);
    tray.inert = !(V.tray || (wide() && !imm));
    document.getElementById("scrim").hidden = !V.tray;
    document.getElementById("menu").setAttribute("aria-expanded", String(V.tray));
    document.getElementById("nav").innerHTML = NAV.map(([id, label, ic]) => `<button type="button" data-nav="${id}" ${V.view === id ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[ic]}</svg>${label}</button>`).join("");
    document.getElementById("ptitle").textContent = NAV.find((n) => n[0] === V.view)[1];
    document.getElementById("app").hidden = !imm;
    document.getElementById("home").hidden = imm;
    for (const id of ["steps", "ctx", "exit", "mode"]) document.getElementById(id).hidden = !imm;
    if (!imm) renderHome();
  }

  function renderHome() {
    const label = NAV.find((n) => n[0] === V.view)[1];
    const resumed = resolved().length;
    document.getElementById("home").innerHTML = `
      ${V.view === "dashboard" ? `<section class="card ghost-kpis" aria-hidden="true">
        <div class="kpi"><span>Produção</span><strong>3.798.315</strong></div>
        <div class="kpi"><span>Atingimento da meta</span><strong>76%</strong></div>
        <div class="kpi"><span>Taxa de apontamento</span><strong>88%</strong></div>
        <div class="kpi"><span>Máquinas ativas</span><strong>12 de 12</strong></div>
      </section>` : ""}
      <section class="card cta">
        <h2>${label}</h2>
        <p>${V.view === "apontamento" ? "" : "Esta seção não faz parte do protótipo. Clique em Apontamento, na bandeja lateral, para entrar no ambiente de apontamento: a bandeja recolhe e o fluxo em três passos ocupa a tela."}</p>
        <button type="button" class="btn btn-primary btn-lg" data-nav="apontamento">${resumed ? "Voltar ao apontamento" : "Entrar no apontamento"}</button>
      </section>`;
  }

  function setTray(open) {
    V.tray = open;
    renderShell();
    if (open) document.querySelector("#nav button")?.focus();
    else document.getElementById("menu").focus();
  }
  function go(view) { V.view = view; V.tray = false; render(); window.scrollTo(0, 0); }
  const anyInput = () => M.some((m) => S.drafts[m.id].orders.some((o) => o.op || o.qty) || S.drafts[m.id].note || S.drafts[m.id].stop);
  function navTo(view) {
    if (view === V.view) { if (V.tray) setTray(false); return; }
    if (V.view === "apontamento" && anyInput()) {
      modal("Sair do apontamento?", "O que você digitou e ainda não concluiu será perdido. As máquinas já concluídas continuam gravadas, e ao voltar o apontamento retoma de onde parou.", "Sair", () => { for (const m of M) S.drafts[m.id] = blankDraft(); S.editing = {}; go(view); }, "Continuar apontando");
      return;
    }
    go(view);
  }

  // ---------- Estado ----------
  const blankOrder = () => ({ op: "", qty: "", rework: false, reason: "" });
  const blankDraft = () => ({ mode: "ok", orders: [blankOrder()], people: "", note: "", showNote: false, stop: "", confirmedHigh: false, showErrors: false });
  const fresh = () => ({
    step: 1,
    turn: { date: "", shift: "", regime: "" },
    showTurnErrors: false,
    status: {}, // id -> { kind: "ok", orders, people, note } | { kind: "off", reason }
    drafts: Object.fromEntries(M.map((m) => [m.id, blankDraft()])),
    editing: {}, // máquinas concluídas reabertas para editar
    filter: "",
    closed: false,
  });
  let S = fresh();

  const resolved = () => M.filter((m) => S.status[m.id]);
  const pending = () => M.filter((m) => !S.status[m.id]);
  const nextPending = (after) => {
    const i = after ? M.findIndex((m) => m.id === after) : -1;
    return [...M.slice(i + 1), ...M.slice(0, i + 1)].find((m) => !S.status[m.id]) || null;
  };
  const goodOf = (orders) => orders.reduce((s, o) => s + (o.rework ? 0 : Number(o.qty) || 0), 0);
  const reworkOf = (orders) => orders.reduce((s, o) => s + (o.rework ? Number(o.qty) || 0 : 0), 0);
  const shiftLabel = () => SHIFTS.find((s) => s.v === S.turn.shift)?.label ?? "";
  const turnReady = () => S.turn.date && S.turn.shift && S.turn.regime;
  const isOpen = (id) => !S.status[id] || S.editing[id];

  // ---------- Barra de passos ----------
  function renderTop() {
    const steps = [["Turno", 1], ["Máquinas", 2], ["Conferir e terminar", 3]];
    const can = (n) => n === 1 || turnReady();
    document.getElementById("steps").innerHTML = steps
      .map(([t, n]) => `<li ${S.step === n ? 'aria-current="step"' : ""} class="${S.step > n ? "done" : ""}"><button type="button" data-go="${n}" ${can(n) ? "" : "disabled"}><span class="dot">${S.step > n ? "✓" : n}</span>${t}</button></li>`)
      .join("");
    document.getElementById("ctx").innerHTML = turnReady() && S.step > 1
      ? `<span class="chip">${dateLabel(S.turn.date)}</span><span class="chip">${shiftLabel()}</span><span class="chip">${S.turn.regime === "extra" ? "Hora extra" : "Normal"}</span><button type="button" class="btn-link" data-go="1">Trocar</button>`
      : "";
  }

  // ---------- Passo 1: o turno, escolhido por quem aponta ----------
  function renderStep1() {
    const e = S.showTurnErrors;
    return `<section class="card step1" aria-labelledby="s1t">
      <div><h2 id="s1t">De qual turno é este apontamento?</h2>
        <p>Escolha a data, o turno e o regime. O que você lançar a seguir vai para este turno.</p></div>
      <div><label class="lbl" for="date">Data</label>
        <input type="date" id="date" value="${S.turn.date}" max="2026-12-31" class="${e && !S.turn.date ? "invalid" : ""}">
        ${e && !S.turn.date ? '<p class="err">Escolha a data.</p>' : ""}</div>
      <div><span class="lbl" id="shl">Turno</span>
        <div class="opts ${e && !S.turn.shift ? "invalid" : ""}" role="group" aria-labelledby="shl">
          ${SHIFTS.map((s) => `<button type="button" class="opt" data-shift="${s.v}" aria-pressed="${S.turn.shift === s.v}">${s.label}</button>`).join("")}
        </div>${e && !S.turn.shift ? '<p class="err">Escolha o turno.</p>' : ""}</div>
      <div><span class="lbl" id="rgl">Regime</span>
        <div class="opts ${e && !S.turn.regime ? "invalid" : ""}" role="group" aria-labelledby="rgl">
          <button type="button" class="opt" data-regime="normal" aria-pressed="${S.turn.regime === "normal"}">Normal</button>
          <button type="button" class="opt" data-regime="extra" aria-pressed="${S.turn.regime === "extra"}">Hora extra</button>
        </div>${e && !S.turn.regime ? '<p class="err">Escolha o regime.</p>' : ""}</div>
      <div><button type="button" class="btn btn-primary btn-lg" id="toStep2">Continuar para as máquinas</button></div>
    </section>`;
  }

  // ---------- Passo 2: lista de status fixa + todas as máquinas em sequência ----------
  function progressHtml() {
    const ok = M.filter((m) => S.status[m.id]?.kind === "ok").length;
    const off = M.filter((m) => S.status[m.id]?.kind === "off").length;
    return `<div class="progress">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><strong class="num">${ok + off} de ${M.length} concluídas</strong><span class="hint num" style="margin:0">${M.length - ok - off} pendentes</span></div>
      <div class="bar" role="img" aria-label="${ok} apontadas, ${off} paradas, ${M.length - ok - off} pendentes"><span class="b-ok" style="width:${(ok / M.length) * 100}%"></span><span class="b-off" style="width:${(off / M.length) * 100}%"></span></div>
      <div class="legend"><span><i class="sw b-ok"></i>${ok} ${ok === 1 ? "apontada" : "apontadas"}</span><span><i class="sw b-off"></i>${off} não ${off === 1 ? "produziu" : "produziram"}</span></div>
    </div>`;
  }

  function renderStatus(next) {
    return `<aside class="card status" aria-label="Situação das máquinas">
      ${progressHtml()}
      <div><label class="lbl" for="filter">Procurar máquina</label><input type="text" id="filter" placeholder="Nome da máquina" value="${esc(S.filter)}" autocomplete="off"></div>
      ${LINES.map((l) => `<div><p class="group-t">${l}</p><ul class="srows">${M.filter((m) => m.line === l).map((m) => {
        const st = S.status[m.id];
        return `<li><button type="button" class="srow ${st ? st.kind : ""} ${next && next.id === m.id ? "next" : ""}" data-goto="${m.id}" title="${esc(m.name)}"><span class="st" aria-hidden="true"></span><span class="nm">${esc(m.name)}</span></button></li>`;
      }).join("")}</ul></div>`).join("")}
      <button type="button" class="btn btn-default" data-go="3">Conferir e terminar o turno</button>
    </aside>`;
  }

  function doneCard(m) {
    const st = S.status[m.id];
    const sum = st.kind === "ok"
      ? `${fmt(goodOf(st.orders))} peças${reworkOf(st.orders) ? ` + ${fmt(reworkOf(st.orders))} retrabalho` : ""} · OP ${st.orders.map((o) => o.op).join(", ")}`
      : `Não produziu: ${st.reason}`;
    return `<article class="card mdone" id="card-${m.id}" aria-label="${esc(m.name)}">
      ${st.kind === "ok" ? '<span class="loz loz-ok">Apontada</span>' : '<span class="loz loz-off">Parada</span>'}
      <h3>${esc(m.name)}</h3>
      <span class="sum">${esc(sum)}</span>
      <button type="button" class="btn-link" data-edit="${m.id}">Editar</button>
    </article>`;
  }

  function openCard(m, next) {
    const d = S.drafts[m.id];
    const e = d.showErrors;
    const head = `<div class="mhead">
        <h3>${esc(m.name)}</h3>
        ${S.editing[m.id] ? '<span class="loz loz-edit">Editando</span>' : '<span class="loz loz-off">Pendente</span>'}
      </div>
      <div class="mmeta">
        <span>${m.perShift ? `Meta do turno <b class="num">${fmt(m.perShift)}</b>${m.byPeople ? ` com ${m.stdPeople} pessoas` : ""}` : "Por demanda, sem meta"}</span>
        <span>${m.released.length === 1 ? "OP liberada" : "OPs liberadas"} <b class="mono">${m.released.join(", ")}</b></span>
      </div>`;
    const actions = `<div class="mactions">
        ${d.mode === "ok" ? `<button type="button" class="btn btn-subtle" data-tooff="${m.id}">Não produziu</button>` : `<button type="button" class="btn btn-subtle" data-took="${m.id}">Voltar: ela produziu</button>`}
        ${S.editing[m.id] ? `<button type="button" class="btn btn-subtle" data-canceledit="${m.id}">Cancelar edição</button>` : ""}
        <span class="sp"></span>
        <button type="button" class="btn btn-primary" data-finish="${m.id}">Concluir</button>
      </div>`;
    const cls = `card mcard ${next && next.id === m.id ? "next" : ""}`;

    if (d.mode === "off") {
      return `<article class="${cls}" id="card-${m.id}" aria-label="${esc(m.name)}">${head}
        <div class="stopped">
          <span class="lbl" id="st-${m.id}" style="margin:0">Por que a máquina não produziu neste turno?</span>
          <div class="chips" role="group" aria-labelledby="st-${m.id}">${STOP_REASONS.map((r) => `<button type="button" data-stop="${m.id}" data-val="${esc(r)}" aria-pressed="${d.stop === r}">${r}</button>`).join("")}</div>
          ${e && !d.stop ? '<p class="err">Escolha o motivo.</p>' : ""}
        </div>
        ${actions}
      </article>`;
    }

    const good = goodOf(d.orders);
    const high = m.perShift && good > 2 * m.perShift && !d.confirmedHigh;
    const many = d.orders.length > 1;
    const orders = d.orders.map((o, i) => {
      const qtyErr = e && !(Number(o.qty) > 0);
      const opErr = e && !/^\d{1,15}$/.test(o.op);
      const id = `${m.id}-${i}`;
      return `<div class="op">
        <div><label class="lbl" for="op-${id}">${many ? `Nº da OP ${i + 1}` : "Nº da OP"}</label>
          <input type="text" inputmode="numeric" id="op-${id}" class="mono ${opErr ? "invalid" : ""}" value="${esc(o.op)}" data-op="${id}" list="ops-${m.id}" placeholder="Ex.: 4501234" autocomplete="off">
          ${opErr ? '<p class="err">Só números, até 15 dígitos.</p>' : m.released.includes(o.op) ? '<p class="hint">OP liberada desta máquina</p>' : ""}</div>
        <div><label class="lbl" for="q-${id}">Quantidade</label>
          <input type="number" inputmode="numeric" min="0" id="q-${id}" class="qty ${qtyErr ? "invalid" : ""}" value="${esc(o.qty)}" data-qty="${id}" placeholder="0">
          ${qtyErr ? '<p class="err">Informe a quantidade.</p>' : ""}</div>
        <div class="op-tools">
          <label class="check"><input type="checkbox" data-rework="${id}" ${o.rework ? "checked" : ""}> Retrabalho</label>
          ${many ? `<button type="button" class="btn-link btn-danger-o" data-remove="${id}">Tirar</button>` : ""}
        </div>
        ${o.rework ? `<div class="reason"><label class="lbl" for="r-${id}">Motivo do retrabalho</label>
          <input type="text" id="r-${id}" data-reason="${id}" value="${esc(o.reason)}" list="motivos" placeholder="Ex.: rebarba na peça" maxlength="80" class="${e && !o.reason.trim() ? "invalid" : ""}">
          ${e && !o.reason.trim() ? '<p class="err">Escreva o motivo do retrabalho.</p>' : ""}</div>` : ""}
      </div>`;
    }).join("");
    const peopleErr = e && m.byPeople && !(Number(d.people) > 0);
    return `<article class="${cls}" id="card-${m.id}" aria-label="${esc(m.name)}">${head}
      <datalist id="ops-${m.id}">${m.released.map((r) => `<option value="${r}">`).join("")}</datalist>
      ${orders}
      ${high ? `<div class="warn" role="status"><span><b>Confere ${fmt(good)} peças?</b> A meta do turno é ${fmt(m.perShift)}. Se for um zero a mais, corrija a quantidade.</span><button type="button" class="btn" data-okhigh="${m.id}">Está certo</button></div>` : ""}
      <div class="extras">
        ${m.byPeople ? `<div><label class="lbl" for="p-${m.id}">Nº de pessoas</label><input type="number" min="1" inputmode="numeric" id="p-${m.id}" data-people="${m.id}" value="${esc(d.people)}" class="people ${peopleErr ? "invalid" : ""}">${peopleErr ? '<p class="err">Informe as pessoas.</p>' : ""}</div>` : ""}
        <button type="button" class="btn-link" data-addop="${m.id}">+ Adicionar OP</button>
        ${d.showNote ? "" : `<button type="button" class="btn-link" data-shownote="${m.id}">+ Adicionar observação</button>`}
      </div>
      ${d.showNote ? `<div><label class="lbl" for="n-${m.id}">Observação do turno</label><textarea id="n-${m.id}" data-note="${m.id}" rows="2" maxlength="500">${esc(d.note)}</textarea></div>` : ""}
      ${actions}
    </article>`;
  }

  function renderStep2() {
    const next = nextPending(null);
    const q = S.filter.trim().toLowerCase();
    const match = (m) => !q || m.name.toLowerCase().includes(q);
    const groups = LINES.map((l) => [l, M.filter((m) => m.line === l && match(m))]).filter(([, ms]) => ms.length);
    const done = M.length - pending().length;
    return `<div class="split">
      ${renderStatus(next)}
      <div class="machines">
        <div class="mobile-bar"><strong class="num">${done} de ${M.length} concluídas</strong>${next ? `<button type="button" class="btn-link" data-goto="${next.id}">Próxima pendente</button>` : `<button type="button" class="btn-link" data-go="3">Conferir e terminar</button>`}</div>
        ${groups.map(([l, ms]) => `<section class="mgroup" aria-label="${l}"><h2>${l} <span>${ms.filter((m) => S.status[m.id]).length} de ${ms.length} concluídas</span></h2>
          ${ms.map((m) => (isOpen(m.id) ? openCard(m, next) : doneCard(m))).join("")}</section>`).join("")}
        ${!groups.length ? '<p class="hint">Nenhuma máquina com esse nome.</p>' : ""}
        <div style="display:flex;justify-content:flex-end"><button type="button" class="btn btn-primary btn-lg" data-go="3">Conferir e terminar o turno</button></div>
      </div>
    </div>
    <datalist id="motivos">${REASONS.map((r) => `<option value="${r}">`).join("")}</datalist>`;
  }

  // ---------- Passo 3: conferir ----------
  function renderStep3() {
    if (S.closed) {
      return `<section class="card done-msg step3"><h2>Turno encerrado</h2>
        <p class="hint">${shiftLabel()} de ${dateLabel(S.turn.date)}: ${resolved().length} de ${M.length} máquinas concluídas. Correções depois disso são feitas no Histórico.</p>
        <button type="button" class="btn btn-default" id="reset2">Começar outro apontamento</button></section>`;
    }
    const oks = M.filter((m) => S.status[m.id]?.kind === "ok");
    const offs = M.filter((m) => S.status[m.id]?.kind === "off");
    const pend = pending();
    const total = oks.reduce((s, m) => s + goodOf(S.status[m.id].orders), 0);
    const rework = oks.reduce((s, m) => s + reworkOf(S.status[m.id].orders), 0);
    const warns = [];
    for (const m of oks) {
      const g = goodOf(S.status[m.id].orders);
      if (m.perShift && g > 2 * m.perShift) warns.push([m, `${fmt(g)} peças, mais que o dobro da meta (${fmt(m.perShift)})`]);
      if (m.perShift && g < 0.3 * m.perShift) warns.push([m, `${fmt(g)} peças, menos de 30% da meta (${fmt(m.perShift)})`]);
    }
    const seen = {};
    for (const m of oks) for (const o of S.status[m.id].orders) (seen[o.op] ??= []).push(m);
    for (const [op, ms] of Object.entries(seen)) if (new Set(ms).size > 1) warns.push([ms[1], `OP ${op} também apontada em ${ms[0].name}`]);
    return `<div class="step3">
      <section class="card kpis" aria-label="Resumo do turno">
        <div class="kpi"><span>Apontadas</span><strong>${oks.length}</strong></div>
        <div class="kpi"><span>Não produziram</span><strong>${offs.length}</strong></div>
        <div class="kpi"><span>Pendentes</span><strong style="color:${pend.length ? "var(--warning)" : "inherit"}">${pend.length}</strong></div>
        <div class="kpi"><span>Peças boas</span><strong>${fmt(total)}</strong>${rework ? `<span>+ ${fmt(rework)} retrabalho</span>` : ""}</div>
      </section>
      ${warns.length ? `<section class="card box"><h3>Vale conferir</h3><ul class="plain">${warns.map(([m, t]) => `<li><span><b>${esc(m.name)}</b>: ${esc(t)}</span><button type="button" class="btn-link" data-edit="${m.id}">Abrir</button></li>`).join("")}</ul><p class="hint">Os avisos não impedem de terminar.</p></section>` : ""}
      ${pend.length ? `<section class="card box"><h3>Ainda sem apontamento</h3><ul class="plain">${pend.map((m) => `<li><span>${esc(m.name)}</span><span style="display:flex;gap:12px"><button type="button" class="btn-link" data-goto="${m.id}">Apontar</button><button type="button" class="btn-link" data-quickoff="${m.id}">Não produziu</button></span></li>`).join("")}</ul></section>` : ""}
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button type="button" class="btn btn-default" data-go="2">Voltar às máquinas</button>
        <button type="button" class="btn btn-primary btn-lg" id="close-turn">Terminar o turno</button>
      </div>
    </div>`;
  }

  // ---------- Desenho ----------
  let lastFocus = null;
  function render() {
    renderShell();
    renderTop();
    if (V.view !== "apontamento") return;
    document.getElementById("app").innerHTML = S.step === 1 ? renderStep1() : S.step === 2 ? renderStep2() : renderStep3();
    if (lastFocus) {
      const el = document.getElementById(lastFocus.id);
      if (el) { el.focus({ preventScroll: true }); if (lastFocus.sel != null && el.setSelectionRange) try { el.setSelectionRange(lastFocus.sel, lastFocus.sel); } catch (_) {} }
      lastFocus = null;
    }
  }
  const keepFocus = (el) => { let sel = null; try { sel = el.selectionStart; } catch (_) {} lastFocus = { id: el.id, sel }; };
  const scrollToCard = (id, focus = true) => {
    const card = document.getElementById(`card-${id}`);
    if (!card) return;
    card.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    if (focus) setTimeout(() => card.querySelector("input")?.focus({ preventScroll: true }), 300);
  };

  let toastT;
  function toast(msg) {
    const layer = document.getElementById("layer");
    layer.querySelector(".toast")?.remove();
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    layer.appendChild(t);
    clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3000);
  }

  function modal(title, body, primary, onOk, cancel = "Cancelar") {
    const layer = document.getElementById("layer");
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${title}</h2><p class="hint" style="margin:0">${body}</p><div class="row-btn"><button type="button" class="btn btn-subtle" data-x>${cancel}</button><button type="button" class="btn btn-primary" data-ok>${primary}</button></div></div>`;
    layer.appendChild(bg);
    bg.querySelector("[data-ok]").focus();
    const close = () => bg.remove();
    bg.addEventListener("click", (ev) => { if (ev.target === bg || ev.target.closest("[data-x]")) close(); if (ev.target.closest("[data-ok]")) { close(); onOk(); } });
    bg.addEventListener("keydown", (ev) => { if (ev.key === "Escape") close(); });
  }

  // ---------- Ações ----------
  const split = (key) => { const k = key.lastIndexOf("-"); return [key.slice(0, k), Number(key.slice(k + 1))]; };
  const showMachine = (id, focus = true) => { S.step = 2; render(); scrollToCard(id, focus); };

  function finish(id) {
    const m = byId(id);
    const d = S.drafts[id];
    if (d.mode === "off") {
      if (!d.stop) { d.showErrors = true; return render(); }
      S.status[id] = { kind: "off", reason: d.stop };
    } else {
      const bad = d.orders.some((o) => !/^\d{1,15}$/.test(o.op) || !(Number(o.qty) > 0) || (o.rework && !o.reason.trim())) || (m.byPeople && !(Number(d.people) > 0));
      if (bad) { d.showErrors = true; render(); document.querySelector(`#card-${id} .invalid`)?.focus(); return; }
      if (m.perShift && goodOf(d.orders) > 2 * m.perShift && !d.confirmedHigh) { render(); document.querySelector(`[data-okhigh="${id}"]`)?.focus(); return; }
      S.status[id] = { kind: "ok", orders: d.orders.map((o) => ({ op: o.op, qty: Number(o.qty), rework: o.rework, reason: o.rework ? o.reason.trim() : "" })), people: d.people, note: d.note.trim() };
    }
    delete S.editing[id];
    d.showErrors = false;
    const nxt = nextPending(id);
    render();
    if (nxt) { toast(`${m.name}: gravada`); scrollToCard(nxt.id); }
    else toast("Todas as máquinas concluídas. Confira e termine o turno.");
  }

  function goStep(n) {
    if (n > 1 && !turnReady()) { S.showTurnErrors = true; S.step = 1; render(); return; }
    S.step = n; render(); window.scrollTo(0, 0);
  }

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button");
    if (!t || t.closest(".modal-bg")) return;
    const ds = t.dataset;
    if (ds.nav) return navTo(ds.nav);
    if (t.id === "menu") return setTray(!V.tray);
    if (t.id === "exit") return navTo("dashboard");
    if (ds.go) return goStep(Number(ds.go));
    if (ds.shift) {
      const set = () => { S.turn.shift = ds.shift; render(); };
      if (resolved().length && S.turn.shift && S.turn.shift !== ds.shift) modal("Trocar o turno?", "As máquinas já concluídas ficam gravadas no turno anterior. A lista recomeça para o turno novo.", "Trocar o turno", () => { const t0 = S.turn; S = fresh(); S.turn = t0; set(); });
      else set();
      return;
    }
    if (ds.regime) { S.turn.regime = ds.regime; return render(); }
    if (t.id === "toStep2") {
      if (!turnReady()) { S.showTurnErrors = true; render(); return; }
      S.showTurnErrors = false; S.step = 2; render(); window.scrollTo(0, 0); return;
    }
    if (ds.goto) {
      // máquina concluída abre para editar; pendente só recebe o foco
      if (S.status[ds.goto]) startEdit(ds.goto);
      return showMachine(ds.goto);
    }
    if (ds.finish) return finish(ds.finish);
    if (ds.edit) { startEdit(ds.edit); return showMachine(ds.edit); }
    if (ds.canceledit) { delete S.editing[ds.canceledit]; return render(); }
    if (ds.tooff) { S.drafts[ds.tooff].mode = "off"; S.drafts[ds.tooff].showErrors = false; return render(); }
    if (ds.took) { S.drafts[ds.took].mode = "ok"; S.drafts[ds.took].showErrors = false; return render(); }
    if (ds.quickoff) { S.drafts[ds.quickoff].mode = "off"; return showMachine(ds.quickoff, false); }
    if (ds.stop) { S.drafts[ds.stop].stop = ds.val; return render(); }
    if (ds.addop) { const d = S.drafts[ds.addop]; d.orders.push(blankOrder()); render(); document.getElementById(`op-${ds.addop}-${d.orders.length - 1}`)?.focus(); return; }
    if (ds.remove) { const [id, i] = split(ds.remove); S.drafts[id].orders.splice(i, 1); return render(); }
    if (ds.okhigh) { S.drafts[ds.okhigh].confirmedHigh = true; return render(); }
    if (ds.shownote) { S.drafts[ds.shownote].showNote = true; render(); document.getElementById(`n-${ds.shownote}`)?.focus(); return; }
    if (t.id === "close-turn") {
      const p = pending().length;
      const doClose = () => { S.closed = true; render(); };
      if (p) modal(`Terminar com ${p} ${p === 1 ? "máquina pendente" : "máquinas pendentes"}?`, "Elas vão aparecer como sem apontamento. Se alguma não produziu, marque o motivo antes.", "Terminar assim", doClose, "Voltar");
      else doClose();
      return;
    }
    if (t.id === "reset" || t.id === "reset2") { S = fresh(); render(); window.scrollTo(0, 0); return; }
    if (t.id === "sample") { loadSample(); return; }
  });

  function startEdit(id) {
    const st = S.status[id];
    if (!st || S.editing[id]) return;
    S.editing[id] = true;
    S.drafts[id] = st.kind === "ok"
      ? { ...blankDraft(), orders: st.orders.map((o) => ({ op: o.op, qty: String(o.qty), rework: o.rework, reason: o.reason })), people: st.people || "", note: st.note || "", showNote: !!st.note, confirmedHigh: true }
      : { ...blankDraft(), mode: "off", stop: st.reason };
  }

  document.addEventListener("input", (ev) => {
    const el = ev.target;
    const ds = el.dataset;
    if (el.id === "date") { S.turn.date = el.value; return renderTop(); }
    if (el.id === "filter") { S.filter = el.value; keepFocus(el); return render(); }
    if (ds.op) { const [id, i] = split(ds.op); S.drafts[id].orders[i].op = el.value.replace(/\D/g, "").slice(0, 15); keepFocus(el); return render(); }
    if (ds.qty) { const [id, i] = split(ds.qty); S.drafts[id].orders[i].qty = el.value; S.drafts[id].confirmedHigh = false; keepFocus(el); return render(); }
    if (ds.reason) { const [id, i] = split(ds.reason); S.drafts[id].orders[i].reason = el.value; return; }
    if (ds.people) { S.drafts[ds.people].people = el.value; return; }
    if (ds.note) { S.drafts[ds.note].note = el.value; return; }
  });
  document.addEventListener("change", (ev) => {
    const ds = ev.target.dataset;
    if (ds.rework) {
      const [id, i] = split(ds.rework);
      const o = S.drafts[id].orders[i];
      o.rework = ev.target.checked;
      if (!o.rework) o.reason = "";
      render();
      if (o.rework) document.getElementById(`r-${id}-${i}`)?.focus();
    }
  });
  // Enter na quantidade conclui a máquina e leva à próxima
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && V.tray && !document.querySelector(".modal-bg")) setTray(false);
    if (ev.key === "Enter" && ev.target.matches && ev.target.matches("[data-qty]")) { ev.preventDefault(); finish(split(ev.target.dataset.qty)[0]); }
  });

  document.getElementById("scrim").addEventListener("click", () => setTray(false));
  matchMedia("(min-width: 861px)").addEventListener("change", renderShell);

  function loadSample() {
    V.view = "apontamento"; V.tray = false;
    S = fresh();
    S.turn = { date: "2026-10-08", shift: "1", regime: "normal" };
    S.step = 2;
    const put = (id, orders, extra = {}) => (S.status[id] = { kind: "ok", orders: orders.map(([op, qty, rework, reason]) => ({ op, qty, rework: !!rework, reason: reason || "" })), people: "", note: "", ...extra });
    put("m1", [[byId("m1").released[0], 3820]]);
    put("m4", [[byId("m4").released[0], 10450], [byId("m4").released[0], 380, true, "Rebarba na peça"]]);
    put("m11", [[byId("m11").released[0], 5100]]);
    S.status.m2 = { kind: "off", reason: "Sem OP liberada" };
    put("m3", [[byId("m3").released[0], 2400]]);
    put("e3", [[byId("e3").released[0], 9050]]);
    put("e7", [[byId("e7").released[0], 116000]]); // um zero a mais, para ver o aviso no passo 3
    render();
    toast("Exemplo carregado: Turno 1, 7 de 22 máquinas concluídas");
    const nxt = nextPending(null);
    if (nxt) scrollToCard(nxt.id, false);
  }

  render();
})();
</script>
