<!doctype html>
<html lang="pt-BR" data-color-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Ferramenta interna da fábrica, atrás de login: fora das buscas -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Dash de Produção</title>
    <!-- Logo WEG; o .ico fica para navegadores antigos -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="description" content="Apontamento de produção e acompanhamento de metas · WEG Tomadas &amp; Interruptores, Itajaí." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <script>
      // Aplica o tema antes da primeira pintura (evita flash claro→escuro)
      (function () {
        try {
          var pref = localStorage.getItem("dash-proto.color-mode") || "auto";
          var dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-color-mode", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
